<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="mtnsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a9abf"/>
      <stop offset="60%" stop-color="#a8c8e0"/>
      <stop offset="100%" stop-color="#c4dfe8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a8aab"/>
      <stop offset="100%" stop-color="#3a7090"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a8040"/>
      <stop offset="100%" stop-color="#3a6028"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1000" height="700" fill="url(#mtnsky)"/>
  <!-- Mountain -->
  <polygon points="400,80 700,420 100,420" fill="url(#mtn)"/>
  <!-- Lake Bratan -->
  <ellipse cx="500" cy="510" rx="500" ry="120" fill="url(#water)"/>
  <!-- Temple island base -->
  <ellipse cx="480" cy="490" rx="90" ry="20" fill="#4a7038"/>
  <!-- Meru tower 1 (tallest) -->
  <polygon points="480,220 460,380 500,380" fill="#8a6230"/>
  <!-- Meru tiered roofs (11 tiers) -->
  <rect x="452" y="380" width="56" height="10" fill="#6a4820" rx="1"/>
  <rect x="456" y="370" width="48" height="10" fill="#7a5428" rx="1"/>
  <rect x="460" y="360" width="40" height="10" fill="#8a6030" rx="1"/>
  <rect x="463" y="350" width="34" height="10" fill="#7a5428" rx="1"/>
  <rect x="466" y="340" width="28" height="10" fill="#8a6030" rx="1"/>
  <rect x="469" y="330" width="22" height="10" fill="#7a5428" rx="1"/>
  <rect x="471" y="320" width="18" height="10" fill="#8a6030" rx="1"/>
  <rect x="473" y="310" width="14" height="10" fill="#7a5428" rx="1"/>
  <rect x="475" y="300" width="10" height="10" fill="#8a6030" rx="1"/>
  <rect x="477" y="290" width="6" height="10" fill="#7a5428" rx="1"/>
  <rect x="478" y="282" width="4" height="8" fill="#c8a030" rx="1"/>
  <!-- Temple base platform -->
  <rect x="430" y="460" width="100" height="28" fill="#8a7050" rx="2"/>
  <!-- Meru tower 2 (smaller) -->
  <polygon points="560,300 542,400 578,400" fill="#8a6230"/>
  <rect x="535" y="400" width="46" height="8" fill="#6a4820" rx="1"/>
  <rect x="539" y="392" width="38" height="8" fill="#7a5428" rx="1"/>
  <rect x="542" y="384" width="32" height="8" fill="#8a6030" rx="1"/>
  <rect x="545" y="376" width="26" height="8" fill="#7a5428" rx="1"/>
  <rect x="547" y="368" width="22" height="8" fill="#8a6030" rx="1"/>
  <rect x="549" y="362" width="18" height="8" fill="#c8a030" rx="1"/>
  <rect x="535" y="450" width="46" height="22" fill="#8a7050" rx="2"/>
  <!-- Water reflection shimmer -->
  <ellipse cx="480" cy="510" rx="80" ry="10" fill="#6ab0d0" opacity="0.3"/>
  <ellipse cx="560" cy="520" rx="40" ry="6" fill="#6ab0d0" opacity="0.2"/>
  <!-- Clouds -->
  <ellipse cx="200" cy="120" rx="80" ry="25" fill="white" opacity="0.6"/>
  <ellipse cx="800" cy="90" rx="70" ry="20" fill="white" opacity="0.5"/>
  <ellipse cx="650" cy="150" rx="60" ry="18" fill="white" opacity="0.4"/>
  <!-- Overlay label -->
  <rect x="0" y="630" width="1000" height="70" fill="rgba(16,58,50,0.82)"/>
  <text x="32" y="658" font-family="Georgia,serif" font-size="15" fill="#d6aa52">Candi Kuning · Ulun Danu Bratan · Bedugul</text>
  <text x="32" y="682" font-family="Arial,sans-serif" font-size="13" fill="#a0c4b8">Foto akan ditampilkan setelah dokumentasi KKL tersedia · 19 Agustus 2026</text>
</svg>
